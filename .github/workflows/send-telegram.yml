name: Send Telegram Briefing

on:
  workflow_dispatch:
    inputs:
      message:
        description: Full briefing message
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage"             --data-urlencode "chat_id=${{ secrets.CHAT_ID }}"             --data-urlencode "text=${{ github.event.inputs.message }}"
